<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Swipen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #EEF2E6; color: #163A22; font-family: 'Bricolage Grotesque', system-ui, sans-serif; overflow: hidden">

  <div style="position: absolute; left: 20px; right: 20px; top: 20px; display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 15px; font-weight: 800; letter-spacing: -0.02em">date-o-mat</span>
    <a href="MIdeen.dc.html" style="height: 32px; padding: 0 12px; border-radius: 999px; background: #F6DFD3; color: #5A2416; text-decoration: none; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px">♥ {{ matches }} Matches</a>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 66px; display: flex; justify-content: space-between; align-items: flex-end">
    <h1 style="margin: 0; font-weight: 800; font-size: 54px; line-height: 0.92; letter-spacing: -0.045em">swipen.</h1>
    <span style="font-size: 13px; color: #56604F; padding-bottom: 6px">S. hat 12 geswiped</span>
  </div>

  <div style="position: absolute; left: 34px; top: 150px; width: 322px; height: 430px; border-radius: 30px; background: {{ next.color }}; transform: rotate(4deg); opacity: 0.7"></div>

  <div style="position: absolute; left: 24px; top: 140px; width: 342px; height: 440px; border-radius: 30px; background: #FFFFFF; box-shadow: 0 18px 40px rgba(22,58,34,0.14); overflow: hidden; transform: rotate(-2deg); display: flex; flex-direction: column">
    <div style="position: relative; height: 236px; background: {{ card.color }}; display: flex; align-items: center; justify-content: center">
      <div aria-hidden="true" style="width: 120px; height: 66px; border-radius: 50%; background: {{ card.shape }}; transform: rotate(-24deg)"></div>
      <div aria-hidden="true" style="position: absolute; left: 150px; top: 150px; width: 70px; height: 38px; border-radius: 50%; background: {{ card.shape }}; opacity: 0.6; transform: rotate(28deg)"></div>
      <span style="position: absolute; left: 16px; top: 16px; height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,0.8); font-family: 'DM Mono', monospace; font-size: 11px; display: inline-flex; align-items: center">{{ card.source }}</span>
      <span style="position: absolute; right: 16px; top: 16px; font-family: 'DM Mono', monospace; font-size: 11px">{{ pos }}</span>
    </div>
    <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.035em">{{ card.title }}</div>
      <div style="font-size: 15px; color: #56604F; line-height: 1.35">{{ card.desc }}</div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{ card.tags }}" as="tg" hint-placeholder-count="3">
          <span style="height: 28px; padding: 0 11px; border-radius: 999px; background: #EDF3EA; font-family: 'DM Mono', monospace; font-size: 11px; display: inline-flex; align-items: center">{{ tg.t }}</span>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 604px; display: flex; justify-content: center; align-items: center; gap: 28px">
    <button type="button" onClick="{{ nope }}" aria-label="Nein" style="width: 66px; height: 66px; border: 0; border-radius: 50%; background: #FFFFFF; color: #163A22; box-shadow: 0 6px 16px rgba(22,58,34,0.12); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button type="button" onClick="{{ like }}" aria-label="Ja, will ich" style="width: 78px; height: 78px; border: 0; border-radius: 50%; background: #E58FA6; color: #FFFFFF; box-shadow: 0 8px 20px rgba(229,143,166,0.45); display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg></button>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 688px; text-align: center; font-size: 13px; color: #56604F">Nur wenn ihr beide ♥ drückt, wird’s ein Match.</div>

  <sc-if value="{{ match }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(22,58,34,0.94); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 28px; text-align: center; z-index: 5">
      <div aria-hidden="true" style="display: flex; align-items: center">
        <span style="width: 64px; height: 64px; border-radius: 50%; background: #DCEBD9; color: #163A22; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center">J</span>
        <span style="width: 64px; height: 64px; border-radius: 50%; background: #F6DFD3; color: #5A2416; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-left: -14px">S</span>
      </div>
      <div style="font-size: 72px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.9">match!</div>
      <div style="font-size: 18px; line-height: 1.4">Ihr wollt beide:<br><b>{{ matchTitle }}</b></div>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 10px">
        <a href="MPlan.dc.html" style="height: 56px; border-radius: 999px; background: #FFFFFF; color: #163A22; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Direkt planen</a>
        <button type="button" onClick="{{ weiter }}" style="height: 54px; border: 2px solid #FFFFFF; border-radius: 999px; background: transparent; color: #FFFFFF; font-size: 16px; font-weight: 700">Weiter swipen</button>
      </div>
    </div>
  </sc-if>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; color: #163A22">
    <a href="MBeet.dc.html" aria-label="Beet" style="height: 60px; display: flex; align-items: center; justify-content: center; opacity: 0.6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6zM12 11C12 7 9 5 5 5c0 4 3 6 7 6z"/></svg></a>
    <a href="MIdeen.dc.html" aria-label="Ideen" style="height: 60px; display: flex; align-items: center; justify-content: center; opacity: 0.6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></a>
    <a href="MSwipe.dc.html" aria-label="Swipen" style="justify-self: center; width: 60px; height: 60px; border-radius: 50%; background: #E58FA6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 8px 18px rgba(229,143,166,0.4)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="12" height="16" rx="2.5" transform="rotate(8 13 11)"/><path d="M5.5 6.5L4 17.5a2 2 0 0 0 1.7 2.3l7.3 1"/><path d="M13.2 9.6c.8-.8 2.1-.8 2.9 0 .8.8.8 2.1 0 2.9l-2.9 2.9-2.9-2.9c-.8-.8-.8-2.1 0-2.9.8-.8 2.1-.8 2.9 0z"/></svg></a>
    <a href="MArchiv.dc.html" aria-label="Archiv" style="height: 60px; display: flex; align-items: center; justify-content: center; opacity: 0.6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-7 8"/></svg></a>
    <a href="MSetup.dc.html" aria-label="Einstellungen" style="height: 60px; display: flex; align-items: center; justify-content: center; opacity: 0.6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"zeigeMatch":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const m = !!props.zeigeMatch;
    this.state = { idx: 0, match: m, matchTitle: m ? 'Kajak auf dem Rhein' : '', matches: m ? 6 : 5 };
  }
  cards() {
    return [
      { title: 'Kajak auf dem Rhein', desc: 'Zwei Stunden paddeln, danach Pommes am Ufer.', tags: ['klein', 'draußen', '~2 h'], color: '#DCE7F5', shape: '#9DB8E3', source: 'Vorschlag', sLiked: true },
      { title: 'Töpferkurs für zwei', desc: 'Abends Tassen drehen, die ihr dann wirklich benutzt.', tags: ['groß', 'drinnen', '~3 h'], color: '#F7EBC4', shape: '#E3C76E', source: 'Vorschlag', sLiked: false },
      { title: 'Nachtflohmarkt', desc: 'Mit 10 € pro Person das schrägste Teil finden.', tags: ['klein', 'draußen', 'Köln'], color: '#E6E0F2', shape: '#B7A7DE', source: 'Köln', sLiked: true },
      { title: 'Escape Room', desc: '60 Minuten, ein Schloss, null Ausreden.', tags: ['klein', 'drinnen', '~1 h'], color: '#F6DFD3', shape: '#E8A58D', source: 'Vorschlag', sLiked: false },
      { title: 'Sterne gucken in der Eifel', desc: 'Decke, Thermoskanne, Sternbilder-App.', tags: ['groß', 'draußen', 'Abend'], color: '#DCEBD9', shape: '#8FC79A', source: 'Vorschlag', sLiked: true }
    ];
  }
  renderVals() {
    const cs = this.cards();
    const i = this.state.idx % cs.length;
    const c = cs[i], n = cs[(i + 1) % cs.length];
    return {
      card: { ...c, tags: c.tags.map((t) => ({ t })) },
      next: n,
      pos: (i + 1) + ' / ' + cs.length,
      match: this.state.match, matchTitle: this.state.matchTitle, matches: this.state.matches,
      like: () => this.setState({ idx: this.state.idx + 1, match: c.sLiked, matchTitle: c.title, matches: this.state.matches + (c.sLiked ? 1 : 0) }),
      nope: () => this.setState({ idx: this.state.idx + 1 }),
      weiter: () => this.setState({ match: false })
    };
  }
}
</script>
</body>
</html>
