<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ideen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
input::placeholder{color:#6B7566}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #EEF2E6; color: #163A22; font-family: 'Bricolage Grotesque', system-ui, sans-serif; overflow: hidden">

  <div style="position: absolute; left: 20px; right: 20px; top: 20px; display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 15px; font-weight: 800; letter-spacing: -0.02em">date-o-mat</span>
    <span style="font-family: 'DM Mono', monospace; font-size: 11px">36 Ideen</span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 62px">
    <h1 style="margin: 0; font-weight: 800; font-size: 54px; line-height: 0.92; letter-spacing: -0.045em">ideen.</h1>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 128px; height: 52px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; padding: 0 5px 0 16px; gap: 8px">
    <label for="neue-idee" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Neue Idee</label>
    <input id="neue-idee" type="text" placeholder="Eigene Idee eintragen …" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 16px; color: #163A22">
    <button type="button" aria-label="Idee hinzufügen" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #163A22; color: #FFFFFF; font-size: 22px; line-height: 1">+</button>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 192px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="MSwipe.dc.html" style="grid-column: span 2; height: 150px; border-radius: 24px; background: #F6DFD3; color: #5A2416; text-decoration: none; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Eure Matches</span><span style="font-size: 13px">vom Swipen · ihr wollt beide</span></span>
        <span style="font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -0.04em">5</span>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: nowrap; overflow: hidden">
        <span style="flex: none; height: 30px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">Kajak auf dem Rhein</span>
        <span style="flex: none; height: 30px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">Nachtflohmarkt</span>
        <span style="flex: none; height: 30px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">+3</span>
      </div>
    </a>
    <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="6">
      <a href="#" style="height: 112px; border-radius: 22px; background: {{ t.bg }}; text-decoration: none; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden">
        <span aria-hidden="true" style="position: absolute; right: -12px; top: -12px; width: 58px; height: 58px; border-radius: {{ t.shapeR }}; background: {{ t.shape }}"></span>
        <span style="font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.04em">{{ t.n }}</span>
        <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 700">{{ t.label }}</span><span style="font-size: 12px; color: #56604F">{{ t.sub }}</span></span>
      </a>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; color: #163A22; background: #EEF2E6">
    <a href="MBeet.dc.html" aria-label="Beet" style="height: 60px; display: flex; align-items: center; justify-content: center; opacity: 0.6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6zM12 11C12 7 9 5 5 5c0 4 3 6 7 6z"/></svg></a>
    <a href="MIdeen.dc.html" aria-label="Ideen" style="height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
      <span style="width: 4px; height: 4px; border-radius: 50%; background: currentColor"></span></a>
    <a href="MSwipe.dc.html" aria-label="Swipen" style="justify-self: center; width: 60px; height: 60px; border-radius: 50%; background: #163A22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 8px 18px rgba(22,58,34,0.25)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="12" height="16" rx="2.5" transform="rotate(8 13 11)"/><path d="M5.5 6.5L4 17.5a2 2 0 0 0 1.7 2.3l7.3 1"/><path d="M13.2 9.6c.8-.8 2.1-.8 2.9 0 .8.8.8 2.1 0 2.9l-2.9 2.9-2.9-2.9c-.8-.8-.8-2.1 0-2.9.8-.8 2.1-.8 2.9 0z"/></svg></a>
    <a href="MArchiv.dc.html" aria-label="Archiv" style="height: 60px; display: flex; align-items: center; justify-content: center; opacity: 0.6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-7 8"/></svg></a>
    <a href="MSetup.dc.html" aria-label="Einstellungen" style="height: 60px; display: flex; align-items: center; justify-content: center; opacity: 0.6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tiles = [
      { n: 14, label: 'Klein', sub: 'unter 3 Stunden', bg: '#DCEBD9', shape: '#BFDDB9', shapeR: '50%' },
      { n: 7, label: 'Groß', sub: 'halber Tag & mehr', bg: '#F7EBC4', shape: '#EBD58F', shapeR: '16px' },
      { n: 12, label: 'Draußen', sub: 'wenn’s Wetter passt', bg: '#DCE7F5', shape: '#B9CDEB', shapeR: '50% 50% 0 50%' },
      { n: 9, label: 'Drinnen', sub: 'für Regentage', bg: '#E6E0F2', shape: '#CBBFE6', shapeR: '50%' },
      { n: 11, label: 'In Köln', sub: 'Veedel & Rhein', bg: '#FFFFFF', shape: '#EDF3EA', shapeR: '16px' },
      { n: 6, label: 'Eigene', sub: 'von euch eingetragen', bg: '#FFFFFF', shape: '#F6DFD3', shapeR: '50% 0 50% 50%' }
    ];
    return { tiles };
  }
}
</script>
</body>
</html>
