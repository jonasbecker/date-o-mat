<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Swipen Samentütchen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&amp;family=DM+Mono:wght@400;500&amp;family=Caveat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #111A14; color: #E7EEDF; font-family: 'Bricolage Grotesque', system-ui, sans-serif; overflow: hidden">

  <div style="position: absolute; left: 18px; right: 18px; top: 18px; height: 36px; display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 15px; font-weight: 800; letter-spacing: -0.02em">date-o-mat</span>
    <a href="ThIdeen.dc.html" style="height: 32px; padding: 0 12px; border-radius: 999px; background: #1B2620; text-decoration: none; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6DBA74" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 21v-9M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg>{{ matches }} Keimlinge</a>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 62px; display: flex; justify-content: space-between; align-items: flex-end">
    <h1 style="margin: 0; font-weight: 800; font-size: 54px; line-height: 0.92; letter-spacing: -0.05em">swipen.</h1>
    <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #E4ECDD; color: #111A14; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; margin-bottom: 4px">Gratis · Draußen</span>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 44px; top: 142px; width: 310px; height: 438px; border-radius: 16px; background: #2A3830; transform: rotate(5deg)"></div>

  <div style="position: absolute; left: 30px; top: 134px; width: 330px; height: 446px; transform: rotate(-2deg); filter: drop-shadow(0 18px 30px rgba(0,0,0,0.45))">
    <div style="position: absolute; inset: 0; background: #F5EFC6; border-radius: 0 0 18px 18px; clip-path: polygon(0 10px, 5% 0, 10% 10px, 15% 0, 20% 10px, 25% 0, 30% 10px, 35% 0, 40% 10px, 45% 0, 50% 10px, 55% 0, 60% 10px, 65% 0, 70% 10px, 75% 0, 80% 10px, 85% 0, 90% 10px, 95% 0, 100% 10px, 100% 100%, 0 100%)"></div>
    <div style="position: relative; height: 100%; display: flex; flex-direction: column; color: #1B2620">
      <div style="padding: 20px 18px 8px; display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em">
        <span>SAATGUT FÜR ZWEI</span><span>{{ pos }}</span>
      </div>
      <div style="margin: 0 14px; height: 190px; border-radius: 14px; background: {{ card.color }}; position: relative; overflow: hidden">
        <div aria-hidden="true" style="position: absolute; left: 70px; top: 40px; width: 150px; height: 90px; border-radius: 50%; background: {{ card.shape }}; transform: rotate(-18deg)"></div>
        <div aria-hidden="true" style="position: absolute; left: 190px; top: 112px; width: 74px; height: 42px; border-radius: 50%; background: {{ card.shape }}; opacity: 0.6"></div>
        <span style="position: absolute; left: 12px; bottom: 12px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,0.85); font-family: 'DM Mono', monospace; font-size: 10px; display: inline-flex; align-items: center">{{ card.sorte }}</span>
      </div>
      <div style="padding: 14px 18px 0; display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 27px; font-weight: 800; line-height: 1; letter-spacing: -0.035em">{{ card.title }}</div>
        <div style="font-size: 14px; line-height: 1.35; color: #4A5547">{{ card.desc }}</div>
      </div>
      <div style="margin-top: auto; border-top: 1.5px dashed #C9C2A0; padding: 10px 18px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); font-family: 'DM Mono', monospace; font-size: 10px; color: #4A5547">
        <span>KEIMZEIT<br><b style="color: #1B2620">{{ card.zeit }}</b></span>
        <span>BEET<br><b style="color: #1B2620">{{ card.ort }}</b></span>
        <span>KOSTEN<br><b style="color: #1B2620">{{ card.kosten }}</b></span>
      </div>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 6px; top: 560px; width: 102px; height: 143px; overflow: hidden">
    <div style="width: 300px; height: 420px; transform: scale(0.34); transform-origin: top left">
      <dc-import name="Bloom" stimmung="{{ mood }}" blaetter="{{ 2 }}" welk="{{ -1 }}" grund="#111A14" hint-size="300px,420px"></dc-import>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 606px; display: flex; justify-content: center; align-items: flex-start; gap: 26px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <button type="button" onClick="{{ nope }}" aria-label="Auf den Kompost" style="width: 64px; height: 64px; border: 0; border-radius: 50%; background: #E7EEDF; color: #111A14; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <span style="font-family: 'DM Mono', monospace; font-size: 10px; color: #9FB09C">kompost</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <button type="button" onClick="{{ like }}" aria-label="Einpflanzen" style="width: 76px; height: 76px; border: 0; border-radius: 50%; background: #E58FA6; color: #FFFFFF; box-shadow: 0 0 26px rgba(229,143,166,0.45); display: flex; align-items: center; justify-content: center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg></button>
      <span style="font-family: 'DM Mono', monospace; font-size: 10px; color: #9FB09C">einpflanzen</span>
    </div>
  </div>
  <div style="position: absolute; left: 112px; top: 700px; font-family: 'Caveat', cursive; font-weight: 600; font-size: 19px; color: #F5EFC6; transform: rotate(-3deg)">{{ quip }}</div>

  <sc-if value="{{ match }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(17,26,20,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 28px; text-align: center; z-index: 5">
      <div aria-hidden="true" style="position: relative; width: 120px; height: 120px">
        <div style="position: absolute; left: 58px; top: 40px; width: 5px; height: 60px; border-radius: 3px; background: #4FA25E"></div>
        <div style="position: absolute; left: 62px; top: 40px; width: 44px; height: 24px; border-radius: 50%; background: #6DBA74; transform: rotate(-30deg); transform-origin: left center"></div>
        <div style="position: absolute; left: 14px; top: 52px; width: 44px; height: 24px; border-radius: 50%; background: #4FA25E; transform: rotate(30deg); transform-origin: right center"></div>
        <div style="position: absolute; left: 20px; top: 98px; width: 80px; height: 14px; border-radius: 7px; background: #6B4A33"></div>
      </div>
      <div style="font-size: 68px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.9">keimt!</div>
      <div style="font-size: 17px; line-height: 1.4; color: #C9D4C4">Ihr wollt beide:<br><b style="color: #E7EEDF">{{ matchTitle }}</b></div>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
        <a href="#" style="height: 56px; border-radius: 999px; background: #E4ECDD; color: #111A14; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Direkt planen</a>
        <button type="button" onClick="{{ weiter }}" style="height: 52px; border: 2px solid #E7EEDF; border-radius: 999px; background: transparent; color: #E7EEDF; font-size: 16px; font-weight: 700">Weiter swipen</button>
      </div>
    </div>
  </sc-if>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; color: #E7EEDF">
    <a href="#" aria-label="Beet" style="height: 52px; display: flex; align-items: center; justify-content: center; opacity: 0.6"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6zM12 11C12 7 9 5 5 5c0 4 3 6 7 6z"/></svg></a>
    <a href="ThIdeen.dc.html" aria-label="Ideen" style="height: 52px; display: flex; align-items: center; justify-content: center; opacity: 0.6"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></a>
    <a href="ThSwipe.dc.html" aria-label="Swipen" style="justify-self: center; width: 60px; height: 60px; border-radius: 50%; background: #E58FA6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -22px; box-shadow: 0 0 0 6px #111A14"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="12" height="16" rx="2.5" transform="rotate(8 13 11)"/><path d="M5.5 6.5L4 17.5a2 2 0 0 0 1.7 2.3l7.3 1"/><path d="M13.2 9.6c.8-.8 2.1-.8 2.9 0 .8.8.8 2.1 0 2.9l-2.9 2.9-2.9-2.9c-.8-.8-.8-2.1 0-2.9.8-.8 2.1-.8 2.9 0z"/></svg></a>
    <a href="ThArchiv.dc.html" aria-label="Archiv" style="height: 52px; display: flex; align-items: center; justify-content: center; opacity: 0.6"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-7 8"/></svg></a>
    <a href="ThSetup.dc.html" aria-label="Einstellungen" style="height: 52px; display: flex; align-items: center; justify-content: center; opacity: 0.6"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 0, match: false, matchTitle: '', matches: 0, liked: false };
  }
  renderVals() {
    const cs = [
      { title: 'Street-Art-Tour durch Ehrenfeld', desc: 'Selbst auf Entdeckungstour, schönste Wand fotografieren, dann Falafel.', sorte: 'Sorte: Stadtbummel', zeit: '1 Abend', ort: 'Ehrenfeld', kosten: '0 €', color: '#DCEBD9', shape: '#A9D3A8', sLiked: true },
      { title: 'Sonnenaufgang am Rhein', desc: 'Wecker auf 6:30, Thermoskanne, Croissants von unterwegs.', sorte: 'Sorte: Frühaufsteher', zeit: '2 Std.', ort: 'Rheinufer', kosten: '~8 €', color: '#F7E2C4', shape: '#EFC48D', sLiked: false },
      { title: 'Flohmarkt-Challenge', desc: 'Jeder 10 €, das schrägste Teil gewinnt.', sorte: 'Sorte: Wettkampf', zeit: 'halber Tag', ort: 'Nippes', kosten: '20 €', color: '#E6E0F2', shape: '#C7B9E6', sLiked: true }
    ];
    const i = this.state.idx % cs.length, c = cs[i];
    return {
      card: c, pos: 'Nº ' + (i + 1) + ' / ' + cs.length,
      mood: this.state.liked ? 'froh' : 'wartet',
      quip: this.state.liked ? '← die gefällt mir auch!' : '← na, was meinst du?',
      match: this.state.match, matchTitle: this.state.matchTitle, matches: this.state.matches,
      like: () => this.setState({ idx: this.state.idx + 1, liked: true, match: c.sLiked, matchTitle: c.title, matches: this.state.matches + (c.sLiked ? 1 : 0) }),
      nope: () => this.setState({ idx: this.state.idx + 1, liked: false }),
      weiter: () => this.setState({ match: false })
    };
  }
}
</script>
</body>
</html>
