<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zweisamen · offline</title>
    <style>
      :root { --bg: #eef2e6; --ink: #163a22; --muted: #56604f; --line: #d5dfce; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111a14; --ink: #e7eedf; --muted: #9fb09c; --line: #2f4237; } }
      body {
        margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center;
        font-family: ui-rounded, system-ui, sans-serif; background: var(--bg); color: var(--ink);
      }
      h1 { margin: 0; font-size: 32px; }
      p { margin: 0; max-width: 22rem; font-weight: 600; color: var(--muted); }
      button {
        font: inherit; font-size: 18px; font-weight: 800; padding: 14px 28px; border-radius: 999px;
        border: 0; background: var(--ink); color: var(--bg);
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" width="96" height="96" alt="" style="border-radius: 24px" />
    <h1>Gerade offline 📡</h1>
    <p>Zweisamen braucht Internet, um eure Kalender und Pläne zu laden. Sobald du wieder online bist, geht's weiter.</p>
    <button type="button" onclick="location.reload()">Nochmal versuchen</button>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
