name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    # The suites share ports and wipe their database, so they cannot run side by side on one machine: four
    # jobs, each with its own database, run a fair quarter of them (e2e/run.mjs --shard).
    name: End-to-end (part ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dom
          POSTGRES_PASSWORD: dom
          POSTGRES_DB: dateomat
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database of this job – the suites wipe it.
      DATABASE_URL: postgresql://dom:dom@localhost:5432/dateomat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e -- --shard=${{ matrix.shard }}/4
      - name: Screenshots of the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: e2e/shots/
          if-no-files-found: ignore
          retention-days: 7
